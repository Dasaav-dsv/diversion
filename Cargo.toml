[package]
name = "diversion"
version = "0.1.0"
edition = "2024"
authors = ["Dasaav"]
license = "MIT OR Apache-2.0"

[workspace]
members = ["abi"]
resolver = "3"

[workspace.dependencies]
bump-into = "=0.8.3"
closure-ffi = "5.1.2"
libc = "0.2.189"

[dependencies]
bump-into = { workspace = true, optional = true }
closure-ffi.workspace = true
closure-ffi-iced-x86 = { version = "1.21.0-commit50066fb", default-features = false, features = [
    "decoder",
    "block_encoder",
    "exhaustive_enums",
] } # same as closure-ffi
diversion-abi = { path = "abi", version = "0.1.0", features = [
    "__private_abi",
] }
thiserror = "2.0.18"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

[features]
# TODO: remove custom_cc from default features
default = ["installer", "custom_cc"]
custom_cc = ["installer"]
installer = ["diversion-abi/process_ctx", "dep:bump-into", "dep:libc"]
parking_lot = ["diversion-abi/parking_lot"]
bare_hrtb = ["closure-ffi/proc_macros"]

[dev-dependencies]
rayon = "1.12.0"
