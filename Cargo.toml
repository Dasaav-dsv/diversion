[workspace]
members = ["abi"]
resolver = "3"

[workspace.package]
authors = ["Dasaav"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bump-into = "=0.8.3"
closure-ffi = "5.1.2"
libc = "0.2.189"

[package]
name = "diversion"
version = "0.2.0"
edition = "2024"
repository = "https://github.com/Dasaav-dsv/diversion"
description = "Ergonomic function hooks for Windows and Linux"
authors.workspace = true
license.workspace = true

[dependencies]
bump-into = { workspace = true, optional = true }
closure-ffi.workspace = true
closure-ffi-iced-x86 = { version = "1.21.0-commit50066fb", default-features = false, features = [
    "decoder",
    "block_encoder",
    "exhaustive_enums",
] } # same as closure-ffi
diversion-abi = { path = "abi", version = "0.1.0", features = [
    "__private_abi",
] }
thiserror = "2.0.18"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

[features]
default = ["installer"]
custom = ["installer"]
installer = ["diversion-abi/process_ctx", "dep:bump-into", "dep:libc"]
parking_lot = ["diversion-abi/parking_lot"]
bare_hrtb = ["closure-ffi/proc_macros"]

[package.metadata.docs.rs]
features = ["custom"]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[dev-dependencies]
criterion = "0.8.2"
rayon = "1.12.0"

[[bench]]
name = "overhead"
harness = false
required-features = ["custom"]
